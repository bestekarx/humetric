[project]
name = "humetric"
version = "1.0.0"
description = "Humetric External Platform — domain-agnostic entity metric engine"
license = "MIT"
requires-python = ">=3.11"
# Cekirdek bagimliliklar YALNIZCA MCP sunucusunun ihtiyaci kadar tutuldu.
# mcp_server.py paket icinden hicbir sey import etmiyor; httpx uzerinden
# HuMetric REST API'sine konusan ince bir istemci. Boylece son kullanici
# `uvx --from git+... humetric-mcp` dediginde Postgres surucusu, embedding
# SDK'lari ve FastAPI yigini inmiyor — kurulum saniyeler suruyor.
# API/worker calistiracaklar `humetric[server]` kurar.
dependencies = [
    "httpx>=0.27",
    # ust sinir zorunlu: mcp 2.0 `mcp.server.fastmcp` modulunu
    # `mcp.server.mcpserver` olarak yeniden adlandirdi. Sinir olmadan temiz
    # kurulum 2.x cekiyor ve sunucu import'ta ModuleNotFoundError ile duşuyor.
    # 2.x'e gecis ayri bir is; o zamana kadar 1.x serisinde kaliyoruz.
    "mcp>=1.9,<2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# API, worker, migration ve agent'lari calistirmak icin gereken her sey.
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "pydantic-settings>=2.0",
    "passlib[bcrypt]>=1.7",
    "itsdangerous>=2.1",
    "anthropic>=0.109",
    "voyageai>=0.3",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
]
dev = [
    "humetric[server]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "rich>=13.7",
    "asgi-lifespan>=2.1",
]
byok-openai = [
    "openai>=1.40",
]
byok-google = [
    "google-generativeai>=0.8",
]
byok-all = [
    "openai>=1.40",
    "google-generativeai>=0.8",
]
billing = [
    "stripe>=10.0",
]
analytics = [
    "pyarrow>=15",
    "duckdb>=1.0",
    "boto3>=1.34",
]

[project.scripts]
humetric-api = "humetric.api:main"
humetric-seed = "humetric.seed:main"
humetric-replay = "humetric.replay:main"
humetric-mcp = "humetric.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humetric"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# database.py motoru modul seviyesinde global olarak cache'liyor, yani ilk
# olusturuldugu event loop'a bagli kaliyor. Varsayilan (test basina yeni loop)
# ile ikinci testten itibaren asyncpg baglantilari "attached to a different
# loop" ile patliyordu. Tum testler ve fixture'lar tek loop paylasir.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
